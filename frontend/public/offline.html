<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7A5C18" />
    <title>Offline — Vulyk</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- External pre-paint theme init (CSP script-src 'self'; audit F6). -->
    <script src="/theme-init.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f1e6;
        --ink: #2a2622;
        --muted: #6b6358;
        --accent: #7a5c18;
        --accent-on: #f7f1e6;
        --elev: #efe6d6;
        --line: #e0d6c8;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 42%),
          var(--bg);
      }
      .card {
        width: min(26rem, 100%);
        background: var(--elev);
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        padding: 1.5rem;
        text-align: center;
      }
      img { width: 4.5rem; height: 4.5rem; margin-bottom: 0.75rem; }
      h1 {
        margin: 0 0 0.5rem;
        font-family: Fraunces, Georgia, serif;
        font-size: 1.65rem;
        color: var(--accent);
      }
      p { margin: 0 0 1rem; color: var(--muted); line-height: 1.45; }
      a, button {
        display: inline-block;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-on);
        border-radius: 0.45rem;
        padding: 0.55rem 1rem;
        text-decoration: none;
        font: inherit;
        cursor: pointer;
      }
      .secondary {
        background: transparent;
        color: var(--accent);
        margin-left: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Vulyk" width="72" height="72" />
      <h1>You're offline</h1>
      <p>
        Vulyk can't reach the network right now. Recently viewed cases and runs
        may still be available when you reopen the app shell.
      </p>
      <p>
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Open app</a>
      </p>
    </main>
  </body>
</html>
