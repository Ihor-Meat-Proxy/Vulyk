<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f6b4c" />
    <title>Offline — Vulyk</title>
    <link rel="icon" href="/icons/bee.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f0e8;
        --ink: #1c1914;
        --muted: #5c564c;
        --accent: #0f6b4c;
        --elev: #fffdf8;
        --line: #d9d2c4;
        font-family: "Source Sans 3", "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, #e7f3ec 0%, transparent 42%),
          radial-gradient(circle at 88% 0%, #f7e9d4 0%, transparent 36%),
          var(--bg);
      }
      .card {
        width: min(26rem, 100%);
        background: var(--elev);
        border: 1px solid var(--line);
        border-radius: 0.9rem;
        padding: 1.5rem;
        text-align: center;
      }
      img { width: 4.5rem; height: 4.5rem; margin-bottom: 0.75rem; }
      h1 {
        margin: 0 0 0.5rem;
        font-family: Fraunces, Georgia, serif;
        font-size: 1.65rem;
        color: var(--accent);
      }
      p { margin: 0 0 1rem; color: var(--muted); line-height: 1.45; }
      a, button {
        display: inline-block;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: 0.45rem;
        padding: 0.55rem 1rem;
        text-decoration: none;
        font: inherit;
        cursor: pointer;
      }
      .secondary {
        background: transparent;
        color: var(--accent);
        margin-left: 0.5rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Vulyk bee" width="72" height="72" />
      <h1>You're offline</h1>
      <p>
        Vulyk can't reach the network right now. Recently viewed cases and runs
        may still be available when you reopen the app shell.
      </p>
      <p>
        <button type="button" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Open app</a>
      </p>
    </main>
  </body>
</html>
