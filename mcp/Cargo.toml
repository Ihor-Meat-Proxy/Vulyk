[package]
name = "vulyk-mcp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "MCP server for Vulyk (thin client over the HTTP API)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# rmcp will be wired in workstream W10; Phase 1 ships a stub binary.
