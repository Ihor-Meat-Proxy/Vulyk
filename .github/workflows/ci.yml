name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://vulyk:vulyk@localhost:5432/vulyk

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulyk
          POSTGRES_PASSWORD: vulyk
          POSTGRES_DB: vulyk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulyk -d vulyk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t vulyk-api:ci .
      - name: Build web image
        run: docker build -f frontend/Dockerfile -t vulyk-web:ci ./frontend

  dogfood-ingest:
    name: Dogfood e2e ingest (API + CLI upload)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulyk
          POSTGRES_PASSWORD: vulyk
          POSTGRES_DB: vulyk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulyk -d vulyk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vulyk:vulyk@localhost:5432/vulyk
      VULYK_API_URL: http://127.0.0.1:8080
      BIND_ADDR: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build API and CLI
        run: cargo build -p vulyk-api -p vulyk-cli --release
      - name: Start Vulyk API
        run: |
          ./target/release/vulyk-api > /tmp/vulyk-api.log 2>&1 &
          echo $! > /tmp/vulyk-api.pid
          for i in $(seq 1 60); do
            if curl -fsS "$VULYK_API_URL/health" >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "API failed to start" >&2
          cat /tmp/vulyk-api.log >&2
          exit 1
      - name: Seed project and run e2e smoke + upload
        run: |
          set -euo pipefail
          PROJECT="$(curl -fsS -H 'Content-Type: application/json' \
            -d '{"key":"CI","name":"Dogfood CI","description":"Self-hosted ingest smoke"}' \
            "$VULYK_API_URL/api/v1/projects")"
          PROJECT_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$PROJECT")"

          mkdir -p artifacts
          cat > artifacts/e2e-junit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="vulyk-e2e" tests="2" failures="0">
            <testsuite name="smoke" tests="2" failures="0" skipped="0" errors="0">
              <testcase classname="e2e.health" name="api_health_ok" time="0.01"/>
              <testcase classname="e2e.ingest" name="cli_upload_roundtrip" time="0.02"/>
            </testsuite>
          </testsuites>
          XML
          # Strip accidental leading indentation from the workflow heredoc
          python3 -c "from pathlib import Path; p=Path('artifacts/e2e-junit.xml'); p.write_text('\n'.join(l.lstrip() for l in p.read_text().splitlines())+'\n')"

          cat > artifacts/e2e-results.json <<'JSON'
          {
            "format": "vulyk/results@v1",
            "results": [
              {
                "external_id": "e2e.health::api_health_ok",
                "status": "passed",
                "duration_ms": 10
              }
            ]
          }
          JSON
          python3 -c "from pathlib import Path; p=Path('artifacts/e2e-results.json'); p.write_text('\n'.join(l.lstrip() for l in p.read_text().splitlines())+'\n')"

          ./target/release/vulyk report \
            --file artifacts/e2e-junit.xml \
            --format junit \
            --create-run \
            --project-id "$PROJECT_ID" \
            --run-name "dogfood junit ${GITHUB_RUN_ID:-local}" \
            --api-url "$VULYK_API_URL"

          ./scripts/vulyk-upload.sh \
            --api-url "$VULYK_API_URL" \
            --file artifacts/e2e-results.json \
            --format vulyk_json \
            --create-run \
            --project-id "$PROJECT_ID" \
            --run-name "dogfood json ${GITHUB_RUN_ID:-local}"

          curl -fsS "$VULYK_API_URL/api/v1/projects/${PROJECT_ID}/runs" > /tmp/runs.json
          python3 - <<'PY'
          import json, os, urllib.request
          payload = json.load(open("/tmp/runs.json"))
          runs = payload["items"] if isinstance(payload, dict) else payload
          assert runs, "expected runs"
          api = os.environ["VULYK_API_URL"]
          found = False
          for run in runs:
              with urllib.request.urlopen(f"{api}/api/v1/runs/{run['id']}/results") as r:
                  results = json.load(r)
              if results:
                  found = True
                  print(f"run {run['name']}: {len(results)} results")
          assert found, "expected ingested results"
          PY
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/vulyk-api.pid ]; then kill "$(cat /tmp/vulyk-api.pid)" || true; fi
          cat /tmp/vulyk-api.log || true

  install-script:
    name: Install script check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Syntax, shellcheck, ASCII, toolchain
        run: |
          bash -n scripts/install.sh
          bash -n scripts/perf-smoke.sh
          bash -n scripts/vulyk-upload.sh
          shellcheck -x scripts/install.sh scripts/perf-smoke.sh scripts/vulyk-upload.sh
          # Non-ASCII next to $var breaks macOS bash 3.2 under set -u (e.g. $env_file…)
          if grep -nP '[^\x00-\x7F]' scripts/*.sh; then
            echo "error: non-ASCII bytes in scripts/*.sh (use ASCII only)" >&2
            exit 1
          fi
          ./scripts/install.sh check

  install-script-macos:
    name: Install script check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: check under UTF-8 locale (system bash 3.2)
        env:
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
        run: |
          bash --version
          bash -n scripts/install.sh
          bash -n scripts/perf-smoke.sh
          bash -n scripts/vulyk-upload.sh
          ./scripts/install.sh check

  helm:
    name: Helm chart template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Render chart
        run: ./scripts/install.sh helm-template

  playwright-e2e:
    name: Playwright e2e (login → report)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulyk
          POSTGRES_PASSWORD: vulyk
          POSTGRES_DB: vulyk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vulyk -d vulyk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://vulyk:vulyk@localhost:5432/vulyk
      VULYK_API_URL: http://127.0.0.1:8080
      BIND_ADDR: 127.0.0.1:8080
      VULYK_AUTH_REQUIRED: "true"
      VULYK_JWT_SECRET: e2e-ci-jwt-secret
      VULYK_SECRETS_KEY: e2e-ci-secrets-key
      VULYK_LLM_MOCK: "1"
      VULYK_ADMIN_EMAIL: admin@vulyk.local
      VULYK_ADMIN_PASSWORD: admin12345
      VULYK_SEED_DEMO: "1"
      VULYK_SEED_SAMPLE: "1"
      VULYK_DEMO_EMAIL: user@vulyk.local
      VULYK_DEMO_PASSWORD: user12345
      VULYK_REGISTRATION_MODE: open
      VULYK_DEFAULT_LOCALE: en
      VULYK_DEFAULT_TIMEZONE: UTC
      VULYK_BASE_URL: http://127.0.0.1:5173
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build API
        run: cargo build -p vulyk-api --release
      - name: Setup CLI help
        run: cargo run -p vulyk-api -- setup --help
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Typecheck e2e
        working-directory: e2e
        run: npm run typecheck
      - name: Start API
        run: |
          ./target/release/vulyk-api > /tmp/vulyk-api-e2e.log 2>&1 &
          echo $! > /tmp/vulyk-api-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS "$VULYK_API_URL/health" >/dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "API failed to start" >&2
          cat /tmp/vulyk-api-e2e.log >&2
          exit 1
      - name: Start frontend preview
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/vulyk-web-e2e.log 2>&1 &
          echo $! > /tmp/vulyk-web-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS "$E2E_BASE_URL" >/dev/null; then
              echo "UI ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "UI failed to start" >&2
          cat /tmp/vulyk-web-e2e.log >&2
          exit 1
      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/vulyk-web-e2e.pid ]; then kill "$(cat /tmp/vulyk-web-e2e.pid)" || true; fi
          if [ -f /tmp/vulyk-api-e2e.pid ]; then kill "$(cat /tmp/vulyk-api-e2e.pid)" || true; fi
          cat /tmp/vulyk-api-e2e.log || true
          cat /tmp/vulyk-web-e2e.log || true

  lighthouse:
    name: Lighthouse PWA/a11y
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Chrome for Lighthouse
        run: |
          npx --yes @puppeteer/browsers install chrome@stable
      - name: Start preview
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/vulyk-lh.log 2>&1 &
          echo $! > /tmp/vulyk-lh.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then
              echo "UI ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "UI failed to start" >&2
          cat /tmp/vulyk-lh.log >&2
          exit 1
      - name: Lighthouse PWA + accessibility
        working-directory: frontend
        env:
          LIGHTHOUSE_URL: http://127.0.0.1:5173
          LH_MIN_PWA: "0.8"
          LH_MIN_A11Y: "0.85"
        run: |
          # Point lighthouse at the puppeteer-installed Chrome if present
          CHROME_BIN="$(find "$HOME/.cache/puppeteer" -type f -name chrome -path '*/chrome-linux*/chrome' 2>/dev/null | head -n1 || true)"
          if [ -n "$CHROME_BIN" ]; then
            export CHROME_PATH="$CHROME_BIN"
          fi
          npm run lighthouse:ci
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report.json
          if-no-files-found: ignore
      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/vulyk-lh.pid ]; then kill "$(cat /tmp/vulyk-lh.pid)" || true; fi
          cat /tmp/vulyk-lh.log || true
