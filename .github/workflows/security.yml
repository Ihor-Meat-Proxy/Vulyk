# Security scanning — CVE/deps, containers, SAST, secrets.
# Triggers: PRs, push to main, weekly schedule (catch new CVEs).
# See docs/ci-checks.md. Does not replace required jobs in ci.yml.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:17 UTC — offset from Dependabot Monday runs
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-audit:
    name: Rust (cargo-audit + cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - name: Install cargo-audit + cargo-deny
        run: |
          cargo install cargo-audit cargo-deny --locked --force
      - name: cargo audit
        run: cargo audit
      - name: cargo deny check
        run: cargo deny check

  npm-audit:
    name: JS/TS (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: frontend npm audit
        working-directory: frontend
        # Production + build toolchains; fail on high/critical. Low/moderate
        # (e.g. deepmerge via vite-plugin-pwa with no upstream fix) are reported
        # but do not block — see docs/ci-checks.md.
        run: |
          npm ci
          npm audit --audit-level=high
      - name: e2e npm audit
        working-directory: e2e
        run: |
          npm ci
          npm audit --audit-level=high

  osv:
    name: OSV-Scanner (lockfiles)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.2.1
        with:
          scan-args: |-
            --format=sarif
            --output=osv-results.sarif
            -L Cargo.lock
            -L frontend/package-lock.json
            -L e2e/package-lock.json
        continue-on-error: true
      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
        continue-on-error: true

  trivy-fs:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-images:
    name: Trivy container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: backend/Dockerfile
            tag: vulyk-api:security
          - name: web
            context: ./frontend
            file: frontend/Dockerfile
            tag: vulyk-web:security
          - name: updater
            context: ./deploy/updater
            file: deploy/updater/Dockerfile
            tag: vulyk-updater:security
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }} image
        run: docker build -f "${{ matrix.file }}" -t "${{ matrix.tag }}" "${{ matrix.context }}"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/ci \
            --config p/rust \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config .semgrep.yml \
            --error \
            --sarif \
            --output semgrep.sarif \
            --metrics=off
      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  gitleaks:
    name: Gitleaks secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
