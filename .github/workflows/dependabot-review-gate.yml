# Required supply-chain review gate for Dependabot PRs that introduce new
# packages, new npm install scripts, or maintainer changes. Routine version
# bumps pass. Owner can override with label `supply-chain-reviewed`.
#
# Runs on pull_request (not pull_request_target): Dependabot gets a read-only
# GITHUB_TOKEN and no repository secrets. Does not enable auto-merge.

name: Dependabot review gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: Supply-chain review gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Run review gate
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_REF: HEAD
          DEPENDABOT_MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          SUPPLY_CHAIN_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'supply-chain-reviewed') }}
        run: |
          chmod +x scripts/check-dep-pr-review-gate.py scripts/check-npm-lock-heuristics.py
          python3 scripts/check-dep-pr-review-gate.py
          python3 scripts/check-npm-lock-heuristics.py
