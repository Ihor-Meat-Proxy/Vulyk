# Enable squash auto-merge for Dependabot patch/minor PRs once required checks pass.
# Uses pull_request_target so GITHUB_TOKEN can merge; does NOT check out PR code
# and does not expose repository secrets to untrusted steps.
#
# Policy (#294):
# - Routine version bumps: patch + >=1.x minor auto-merge (0.x minor = breaking).
# - Security-advisory updates: skip cooldown (Dependabot-side) and auto-merge
#   once CI passes, including majors.
# - New packages, new maintainers, or new install scripts: do NOT auto-merge
#   (Dependabot review gate + maintainer-changes); owner review required.
#
# SemVer caveat: for 0.x versions, a "minor" bump is treated as breaking (same as
# major) — only 0.x patch bumps auto-merge for non-security version updates.

name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: Enable auto-merge (safe bumps only)
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Decide whether bump is auto-merge safe
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          MAINTAINER_CHANGES: ${{ steps.metadata.outputs.maintainer-changes }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          echo "safe=false" >> "$GITHUB_OUTPUT"
          echo "reason=denied" >> "$GITHUB_OUTPUT"

          # Owner override after reviewing a high-risk Dependabot PR.
          if [[ ",${PR_LABELS}," == *",supply-chain-reviewed,"* ]]; then
            echo "Owner override label supply-chain-reviewed present"
          elif [[ "${MAINTAINER_CHANGES}" == "true" ]]; then
            echo "Skipping auto-merge: Dependabot reported maintainer changes"
            echo "reason=maintainer-changes" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ ",${PR_LABELS}," == *",needs-owner-review,"* ]]; then
            echo "Skipping auto-merge: needs-owner-review label"
            echo "reason=needs-owner-review" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Security fast path: advisory PRs auto-merge once CI is green
          # (Dependabot security updates already skip cooldown).
          security=false
          if [[ ",${PR_LABELS}," == *",security,"* ]]; then
            security=true
          fi
          body_lc="$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | tr '[:upper:]' '[:lower:]')"
          if printf '%s' "$body_lc" | grep -Eqi 'security (vulnerabilit|advisory|update)|ghsa-[0-9a-z]{4}-|cve-[0-9]{4}-'; then
            security=true
          fi

          if [[ "$security" == "true" ]]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
            echo "reason=security" >> "$GITHUB_OUTPUT"
            echo "Allowing security-advisory update ($PREVIOUS_VERSION -> $NEW_VERSION, type=$UPDATE_TYPE)"
            exit 0
          fi

          case "$UPDATE_TYPE" in
            version-update:semver-patch)
              echo "safe=true" >> "$GITHUB_OUTPUT"
              echo "reason=semver-patch" >> "$GITHUB_OUTPUT"
              echo "Allowing semver-patch ($PREVIOUS_VERSION -> $NEW_VERSION)"
              ;;
            version-update:semver-minor)
              prev_major="${PREVIOUS_VERSION%%.*}"
              if [[ -n "$prev_major" && "$prev_major" != "0" && "$prev_major" =~ ^[0-9]+$ ]]; then
                echo "safe=true" >> "$GITHUB_OUTPUT"
                echo "reason=semver-minor" >> "$GITHUB_OUTPUT"
                echo "Allowing semver-minor for >=1.x ($PREVIOUS_VERSION -> $NEW_VERSION)"
              else
                echo "Skipping 0.x semver-minor (treated as breaking): $PREVIOUS_VERSION -> $NEW_VERSION"
                echo "reason=0x-minor" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "Skipping update-type=$UPDATE_TYPE ($PREVIOUS_VERSION -> $NEW_VERSION)"
              echo "reason=update-type" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Enable squash auto-merge for safe bumps
        if: steps.gate.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
