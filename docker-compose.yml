# Local / demo Compose stack.
# First-run: set VULYK_ADMIN_* in .env (./scripts/install.sh compose) or run:
#   docker compose run --rm api vulyk-api setup --yes
#   # or: ./scripts/install.sh setup
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulyk
      POSTGRES_PASSWORD: vulyk
      POSTGRES_DB: vulyk
    ports:
      - "5432:5432"
    volumes:
      - vulyk_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulyk -d vulyk"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://vulyk:vulyk@db:5432/vulyk
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: vulyk_api=info,tower_http=info
      VULYK_AUTH_REQUIRED: "false"
      VULYK_JWT_SECRET: vulyk-compose-dev-secret
      VULYK_LLM_MOCK: "1"
      # DX defaults — override via .env; password "admin" forces must_change_password
      VULYK_ADMIN_EMAIL: ${VULYK_ADMIN_EMAIL:-admin@vulyk.local}
      VULYK_ADMIN_PASSWORD: ${VULYK_ADMIN_PASSWORD:-admin}
      VULYK_ADMIN_DISPLAY_NAME: ${VULYK_ADMIN_DISPLAY_NAME:-Administrator}
      VULYK_INSTANCE_NAME: ${VULYK_INSTANCE_NAME:-Vulyk}
      VULYK_DEFAULT_LOCALE: ${VULYK_DEFAULT_LOCALE:-en}
      VULYK_DEFAULT_TIMEZONE: ${VULYK_DEFAULT_TIMEZONE:-UTC}
      VULYK_REGISTRATION_MODE: ${VULYK_REGISTRATION_MODE:-open}
      VULYK_SEED_DEMO: ${VULYK_SEED_DEMO:-1}
      VULYK_SEED_SAMPLE: ${VULYK_SEED_SAMPLE:-1}
      VULYK_BASE_URL: ${VULYK_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  vulyk_pg:
