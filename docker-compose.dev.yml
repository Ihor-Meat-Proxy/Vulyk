# Dev overlay: Postgres only. Run API and Vite on the host.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulyk
      POSTGRES_PASSWORD: vulyk
      POSTGRES_DB: vulyk
    ports:
      - "5432:5432"
    volumes:
      - vulyk_pg_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulyk -d vulyk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vulyk_pg_dev:
