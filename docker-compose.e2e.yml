# Isolated local Playwright e2e stack.
# Does NOT use the operator's .env or the default vulyk_pg volume.
# Run via: ./scripts/e2e-local.sh
#
# Project name `vulyk-e2e` keeps containers/volumes separate from
# `docker compose` (docker-compose.yml) and `docker-compose.dev.yml`.
name: vulyk-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vulyk
      POSTGRES_PASSWORD: vulyk
      POSTGRES_DB: vulyk_e2e
    volumes:
      - vulyk_e2e_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulyk -d vulyk_e2e"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Host port only for setup-wizard / debug (optional).
    ports:
      - "${E2E_DB_PORT:-15432}:5432"

  api:
    image: ${VULYK_E2E_API_IMAGE:-vulyk-api:e2e}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: on-failure
    environment:
      DATABASE_URL: postgres://vulyk:vulyk@db:5432/vulyk_e2e
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: vulyk_api=info,tower_http=warn
      # Give Postgres a moment after healthy before first migrate connect.
      VULYK_DB_CONNECT_TIMEOUT_SECS: "30"
      VULYK_AUTH_REQUIRED: "true"
      VULYK_JWT_SECRET: e2e-local-jwt-secret-do-not-use-prod
      VULYK_SECRETS_KEY: e2e-local-secrets-key-do-not-use
      VULYK_LLM_MOCK: "1"
      VULYK_ADMIN_EMAIL: ${VULYK_ADMIN_EMAIL:-admin@vulyk.local}
      VULYK_ADMIN_PASSWORD: ${VULYK_ADMIN_PASSWORD:-admin12345678901}
      VULYK_ADMIN_DISPLAY_NAME: Administrator
      VULYK_DEMO_EMAIL: ${VULYK_DEMO_EMAIL:-user@vulyk.local}
      VULYK_DEMO_PASSWORD: ${VULYK_DEMO_PASSWORD:-user123456789012}
      VULYK_SEED_DEMO: "1"
      VULYK_SEED_SAMPLE: "1"
      VULYK_REGISTRATION_MODE: open
      VULYK_DEFAULT_LOCALE: en
      VULYK_DEFAULT_TIMEZONE: UTC
      VULYK_PASSWORD_MIN_LENGTH: "16"
      VULYK_AUTO_MIGRATE: "true"
      # Writable by the non-root API user (admin backups e2e).
      VULYK_CONTENT_BACKUP_DIR: /var/lib/vulyk/content-backups
      # UI is served by web; SSO callbacks go through the web proxy.
      VULYK_BASE_URL: ${E2E_PUBLIC_BASE_URL:-http://127.0.0.1:15173}
      # Lab-only: allow JWKS fetch to mock-oidc on the compose network.
      VULYK_EGRESS_ALLOW_PRIVATE: "1"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s
    ports:
      - "${E2E_API_PORT:-18080}:8080"

  web:
    image: ${VULYK_E2E_WEB_IMAGE:-vulyk-web:e2e}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${E2E_WEB_PORT:-15173}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Mock OIDC for SSO specs (same network as API).
  mock-oidc:
    image: node:22-bookworm-slim
    working_dir: /oidc
    volumes:
      - ./e2e/mock-oidc:/oidc:ro
    command: ["node", "server.mjs"]
    environment:
      OIDC_PORT: "9090"
      OIDC_ISSUER: http://mock-oidc:9090
      OIDC_CLIENT_ID: vulyk-e2e
    expose:
      - "9090"

  # Official Playwright image, version pinned to lockfile in e2e-local.sh.
  playwright:
    image: ${VULYK_E2E_PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.65.0-jammy}
    working_dir: /work/e2e
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      mock-oidc:
        condition: service_started
    environment:
      CI: "1"
      E2E_BASE_URL: http://web:8080
      VULYK_API_URL: http://api:8080
      VULYK_URL: http://api:8080
      VULYK_ADMIN_EMAIL: ${VULYK_ADMIN_EMAIL:-admin@vulyk.local}
      VULYK_ADMIN_PASSWORD: ${VULYK_ADMIN_PASSWORD:-admin12345678901}
      VULYK_DEMO_EMAIL: ${VULYK_DEMO_EMAIL:-user@vulyk.local}
      VULYK_DEMO_PASSWORD: ${VULYK_DEMO_PASSWORD:-user123456789012}
      # Skip starting an in-process mock; compose service mock-oidc is the issuer.
      E2E_SKIP_MOCK_OIDC: "1"
      E2E_OIDC_ISSUER: http://mock-oidc:9090
      E2E_OIDC_CLIENT_ID: vulyk-e2e
      E2E_OIDC_CLIENT_SECRET: vulyk-e2e-secret
      # Mirrors API so registration-disabled can skip when env forces open.
      VULYK_REGISTRATION_MODE: open
      VULYK_CONTENT_BACKUP_DIR: /var/lib/vulyk/content-backups
      # setup-wizard needs psql against the e2e DB
      DATABASE_URL: postgres://vulyk:vulyk@db:5432/vulyk_e2e
      # Optional reporting into the VUE project (set by e2e-local.sh --report)
      VULYK_CI_TOKEN: ${VULYK_CI_TOKEN:-}
      VULYK_PROJECT: ${VULYK_PROJECT:-VUE}
      VULYK_PROJECT_ID: ${VULYK_PROJECT_ID:-}
      VULYK_CASE_KEY_PREFIX: ${VULYK_CASE_KEY_PREFIX:-VUE}
      VULYK_RUN_NAME: ${VULYK_RUN_NAME:-Local Playwright e2e}
    volumes:
      - ./:/work
      - e2e_node_modules:/work/e2e/node_modules
      - ./e2e/artifacts:/work/e2e/artifacts
    # Override at runtime via e2e-local.sh
    entrypoint: ["bash", "-lc"]
    command:
      - |
        set -euo pipefail
        apt-get update -qq
        apt-get install -y -qq postgresql-client >/dev/null
        cd /work/e2e
        npm ci --no-audit --no-fund
        npx playwright test --reporter=list --reporter=html --reporter=./reporters/vulyk-reporter.ts
    profiles: ["playwright"]

volumes:
  vulyk_e2e_pg:
  e2e_node_modules:
