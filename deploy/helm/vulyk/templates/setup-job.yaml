{{- if .Values.setup.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vulyk.fullname" . }}-setup
  labels:
    {{- include "vulyk.labels" . | nindent 4 }}
    app.kubernetes.io/component: setup
  annotations:
    # post-install only: setup fails once completed; upgrades use migrate Job.
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vulyk.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: {{ .Values.image.api | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["vulyk-api"]
          args:
            - setup
            - --yes
            - --admin-email={{ .Values.setup.adminEmail }}
            - --locale={{ .Values.setup.locale }}
            - --timezone={{ .Values.setup.timezone }}
            - --registration-mode={{ .Values.setup.registrationMode }}
            - --instance-name={{ .Values.setup.instanceName }}
            {{- if .Values.setup.baseUrl }}
            - --base-url={{ .Values.setup.baseUrl }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "vulyk.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulyk.secretName" . }}
                  key: DATABASE_URL
            - name: VULYK_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulyk.secretName" . }}
                  key: VULYK_JWT_SECRET
            - name: VULYK_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulyk.secretName" . }}
                  key: VULYK_SECRETS_KEY
            - name: VULYK_ADMIN_EMAIL
              value: {{ .Values.setup.adminEmail | quote }}
            - name: VULYK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if and .Values.setup.adminPasswordSecretRef .Values.setup.adminPasswordSecretRef.name }}
                  name: {{ .Values.setup.adminPasswordSecretRef.name }}
                  key: {{ .Values.setup.adminPasswordSecretRef.key | default "VULYK_ADMIN_PASSWORD" }}
                  {{- else }}
                  name: {{ include "vulyk.secretName" . }}
                  key: VULYK_ADMIN_PASSWORD
                  {{- end }}
{{- end }}
