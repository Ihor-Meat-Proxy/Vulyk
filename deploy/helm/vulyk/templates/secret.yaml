{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vulyk.secretName" . }}
  labels:
    {{- include "vulyk.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  VULYK_JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  VULYK_SECRETS_KEY: {{ .Values.secrets.secretsKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  VULYK_ADMIN_PASSWORD: {{ coalesce .Values.setup.adminPassword .Values.secrets.adminPassword "change-me-admin1" | quote }}
{{- end }}
