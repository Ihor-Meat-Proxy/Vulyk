{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vulyk.fullname" . }}-migrate
  labels:
    {{- include "vulyk.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # pre-upgrade only: Secret/ConfigMap already exist. Fresh install migrates via
    # the API Deployment initContainer (same `migrate run`, advisory-locked).
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vulyk.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.podSecurityContext.api }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ .Values.image.api | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["vulyk-api"]
          args: ["migrate", "run"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vulyk.secretName" . }}
                  key: DATABASE_URL
            - name: VULYK_AUTO_MIGRATE
              value: "false"
            - name: RUST_LOG
              value: {{ .Values.env.RUST_LOG | quote }}
{{- end }}
