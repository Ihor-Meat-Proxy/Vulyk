image:
  api: vulyk-api:latest
  web: vulyk-web:latest
  pullPolicy: IfNotPresent

replicaCount:
  api: 1
  web: 1

nameOverride: ""
fullnameOverride: ""

# Auth is required by default in production (W11).
auth:
  required: true

env:
  RUST_LOG: vulyk_api=info,tower_http=info
  VULYK_LLM_MOCK: "0"
  VULYK_JWT_TTL_HOURS: "12"
  VULYK_SESSION_TTL_HOURS: "168"

# Schema migrations as a Helm pre-install/pre-upgrade Job (`vulyk-api migrate run`).
# Take a logical backup (pg_dump) before `helm upgrade` — see docs/guides/upgrade.md.
migrate:
  enabled: true
  # API pods should not auto-migrate when the Job owns upgrades (replicas race).
  autoMigrate: false

# First-run setup (Job + env seeding on API). Prefer secretRef for passwords.
# Setup Job is post-install only (not post-upgrade).
setup:
  enabled: true
  adminEmail: admin@vulyk.local
  # Prefer secretRef in real clusters. Inline password is for demos only.
  # adminPasswordSecretRef:
  #   name: vulyk-secrets
  #   key: VULYK_ADMIN_PASSWORD
  adminPasswordSecretRef: {}
  # Used only when adminPasswordSecretRef is empty and secrets.create=true (demos).
  adminPassword: ""
  locale: en
  timezone: UTC
  registrationMode: disabled
  seedDemo: false
  # Seed sample projects: Kyiv Open-Air Concert 2026 + Vulyk QA (suites/cases/runs)
  seedSample: true
  instanceName: Vulyk
  baseUrl: ""

# Existing secret must provide: DATABASE_URL, VULYK_JWT_SECRET, VULYK_SECRETS_KEY
# Optionally create via --set secrets.create=true for demos only.
secrets:
  create: false
  name: vulyk-secrets
  # Used only when secrets.create=true (NOT for real production).
  databaseUrl: postgres://vulyk:change-me@vulyk-postgresql:5432/vulyk
  jwtSecret: change-me-jwt
  secretsKey: change-me-secrets-key
  # Demo admin password when secrets.create=true and setup.adminPassword unset
  adminPassword: change-me-admin12

postgresql:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: vulyk
    password: change-me
    database: vulyk
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    # Annotate the PVC with helm.sh/resource-policy=keep so uninstall does not
    # delete Postgres data. Set false only for ephemeral demo clusters.
    keepOnUninstall: true

service:
  apiPort: 8080
  webPort: 80
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  host: vulyk.local
  tls: []
  annotations: {}

resources:
  api: {}
  web: {}

# Container hardening (security audit M8). API image USER=10001; web unprivileged nginx=101.
podSecurityContext:
  api:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  web:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # API writes attachments under /var/lib/vulyk; nginx needs cache/temp writable.
  readOnlyRootFilesystem: false

probes:
  api:
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 20
