image:
  api: vulyk-api:latest
  web: vulyk-web:latest
  pullPolicy: IfNotPresent

replicaCount:
  api: 1
  web: 1

nameOverride: ""
fullnameOverride: ""

# Auth is required by default in production (W11).
auth:
  required: true

env:
  RUST_LOG: vulyk_api=info,tower_http=info
  VULYK_LLM_MOCK: "0"
  VULYK_JWT_TTL_HOURS: "12"
  VULYK_SESSION_TTL_HOURS: "168"

# First-run setup (Job + env seeding on API). Prefer secretRef for passwords.
setup:
  enabled: true
  adminEmail: admin@vulyk.local
  # Prefer secretRef in real clusters. Inline password is for demos only.
  # adminPasswordSecretRef:
  #   name: vulyk-secrets
  #   key: VULYK_ADMIN_PASSWORD
  adminPasswordSecretRef: {}
  # Used only when adminPasswordSecretRef is empty and secrets.create=true (demos).
  adminPassword: ""
  locale: en
  timezone: UTC
  registrationMode: disabled
  seedDemo: false
  instanceName: Vulyk
  baseUrl: ""

# Existing secret must provide: DATABASE_URL, VULYK_JWT_SECRET, VULYK_SECRETS_KEY
# Optionally create via --set secrets.create=true for demos only.
secrets:
  create: false
  name: vulyk-secrets
  # Used only when secrets.create=true (NOT for real production).
  databaseUrl: postgres://vulyk:change-me@vulyk-postgresql:5432/vulyk
  jwtSecret: change-me-jwt
  secretsKey: change-me-secrets-key
  # Demo admin password when secrets.create=true and setup.adminPassword unset
  adminPassword: change-me-admin1

postgresql:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: vulyk
    password: change-me
    database: vulyk
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

service:
  apiPort: 8080
  webPort: 80
  type: ClusterIP

ingress:
  enabled: false
  className: ""
  host: vulyk.local
  tls: []
  annotations: {}

resources:
  api: {}
  web: {}

probes:
  api:
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 20
