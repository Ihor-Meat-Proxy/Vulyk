[package]
name = "vulyk-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vulyk test management API"
default-run = "vulyk-api"

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.6.0", features = ["getrandom"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cookie = "0.18.2"
csv = "1.3"
genpdf = "0.2"
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
quick-xml = { version = "0.37", features = ["serialize"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "json"] }
thiserror = "2"
time = "0.3.55"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }
tower = { version = "0.5", features = ["util"] }
uuid = "1"

[lib]
name = "vulyk_api"
path = "src/lib.rs"

[[bin]]
name = "vulyk-api"
path = "src/main.rs"
