<!doctype html>
<html lang="en">
<head>
  <title>$title</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>
  <!-- Spec inlined so docs work offline without a second fetch; also served at /api/openapi.json.
       Configuration is injected by the API (see SCALAR_CONFIGURATION in api_docs.rs):
       - withDefaultFonts:false keeps Scalar from loading the font CDN (blocked by CSP)
       - search + Test Request (Try it) enabled against same-origin servers
       - preferredSecurityScheme bearer_auth for the Auth helper -->
  <script
    id="api-reference"
    type="application/json"
    data-configuration='$configuration'
  >
    $spec
  </script>
  <!-- Self-hosted @scalar/api-reference standalone bundle (no CDN). -->
  <script src="/api/docs/assets/scalar.js"></script>
</body>
</html>
