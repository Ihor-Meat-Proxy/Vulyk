# Production-oriented Compose stack for Vulyk (W11).
# Auth is required by default. Override secrets via environment or a .env file.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   # Prefer upgrades via: ./scripts/install.sh upgrade --yes
#
# WARNING: never run `docker compose down -v` — the -v flag deletes named volumes
# (Postgres data). Use `docker compose down` without -v, or ./scripts/install.sh backup.
#
# Required secrets (set in .env.prod or the environment):
#   POSTGRES_PASSWORD, VULYK_JWT_SECRET, VULYK_SECRETS_KEY
# First-run (optional env seed or CLI):
#   VULYK_ADMIN_EMAIL, VULYK_ADMIN_PASSWORD, VULYK_REGISTRATION_MODE (default disabled)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm api vulyk-api setup --yes
#   # or: ./scripts/install.sh setup

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vulyk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vulyk}
    volumes:
      - vulyk_pg_data:/var/lib/postgresql/data
      - vulyk_pg_backup:/backup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vulyk} -d ${POSTGRES_DB:-vulyk}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    image: ${VULYK_API_IMAGE:-vulyk-api:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vulyk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vulyk}
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-vulyk_api=info,tower_http=info}
      VULYK_AUTH_REQUIRED: ${VULYK_AUTH_REQUIRED:-true}
      VULYK_JWT_SECRET: ${VULYK_JWT_SECRET:?set VULYK_JWT_SECRET}
      VULYK_SECRETS_KEY: ${VULYK_SECRETS_KEY:?set VULYK_SECRETS_KEY}
      VULYK_LLM_MOCK: ${VULYK_LLM_MOCK:-0}
      VULYK_JWT_TTL_HOURS: ${VULYK_JWT_TTL_HOURS:-12}
      VULYK_SESSION_TTL_HOURS: ${VULYK_SESSION_TTL_HOURS:-168}
      VULYK_ADMIN_EMAIL: ${VULYK_ADMIN_EMAIL:-}
      VULYK_ADMIN_PASSWORD: ${VULYK_ADMIN_PASSWORD:-}
      VULYK_ADMIN_DISPLAY_NAME: ${VULYK_ADMIN_DISPLAY_NAME:-Administrator}
      VULYK_INSTANCE_NAME: ${VULYK_INSTANCE_NAME:-Vulyk}
      VULYK_DEFAULT_LOCALE: ${VULYK_DEFAULT_LOCALE:-en}
      VULYK_DEFAULT_TIMEZONE: ${VULYK_DEFAULT_TIMEZONE:-UTC}
      VULYK_REGISTRATION_MODE: ${VULYK_REGISTRATION_MODE:-disabled}
      VULYK_SEED_DEMO: ${VULYK_SEED_DEMO:-0}
      VULYK_SEED_SAMPLE: ${VULYK_SEED_SAMPLE:-1}
      # Prod: migrations run via ./scripts/install.sh upgrade (migrate run) before API start.
      VULYK_AUTO_MIGRATE: ${VULYK_AUTO_MIGRATE:-false}
      VULYK_BASE_URL: ${VULYK_BASE_URL:-}
      VULYK_SETUP_TOKEN: ${VULYK_SETUP_TOKEN:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - vulyk_attachments:/var/lib/vulyk/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${VULYK_WEB_IMAGE:-vulyk-web:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  vulyk_pg_data:
  vulyk_pg_backup:
  vulyk_attachments:
