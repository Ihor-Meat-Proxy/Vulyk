# gitleaks — secret scanning. Extends the default ruleset.
# Local: gitleaks detect --source . --verbose
# CI: .github/workflows/security.yml

title = "Vulyk"

[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures, sample data, and documented placeholders (not real credentials)"
paths = [
    '''(^|/)e2e/''',
    '''\.env\.example$''',
    '''(^|/)frontend/licenses/''',
    '''(^|/)docs/''',
    '''(^|/)backend/seed/''',
    '''\.gitleaks\.toml$''',
    '''\.trivyignore$''',
]
regexes = [
    '''e2e-ci-jwt-secret''',
    '''e2e-ci-secrets-key''',
    '''admin12345678901''',
    '''user123456789012''',
    '''changeme''',
    '''KYIV_CONCERT_2026''',
]

[[allowlists]]
description = "Deterministic RSA PEM fixture for offline SSO JWKS unit tests only"
paths = ['''(^|/)backend/src/sso\.rs$''']
ruleIds = ["private-key"]
