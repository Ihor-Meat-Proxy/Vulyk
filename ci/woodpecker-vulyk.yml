# Example Woodpecker pipeline for Vulyk CI reporting.
#
# Save as `.woodpecker.yml` (or `.woodpecker/vulyk.yml`) in the automation repo.
# Configure a Vulyk CI trigger with provider `woodpecker`:
#   base_url  — Woodpecker server (e.g. https://ci.example.com)
#   token     — personal access token (redacted in API responses)
#   repo      — owner/name
#   branch    — optional (default main)
#
# Woodpecker interpolates ${VAR} in the YAML. Use $${VAR} so the container shell
# sees ${VAR} (POSIX sh). Repo secrets are injected as environment variables.
#
# When Vulyk dispatches this pipeline it passes VULYK_RUN_ID / VULYK_PROJECT_ID
# as pipeline variables — attach with --provider woodpecker instead of opening
# a new run. Configure the CI trigger token as a Woodpecker *personal access
# token* (PAT) with repo push / pipeline rights (session cookies fail dispatch).

when:
  - event: [push, manual]
    branch: [main]

steps:
  - name: report-vulyk
    image: alpine:3.20
    commands:
      - |
        set -eu
        apk add --no-cache curl python3 >/dev/null

        if [ ! -f ./scripts/vulyk-upload.sh ]; then
          curl -fsSL -o vulyk-upload.sh \
            https://raw.githubusercontent.com/Ihor-Meat-Proxy/Vulyk/main/scripts/vulyk-upload.sh
          chmod +x vulyk-upload.sh
          UPLOADER=./vulyk-upload.sh
        else
          UPLOADER=./scripts/vulyk-upload.sh
        fi

        export VULYK_API_URL="$${VULYK_API_URL}"
        export VULYK_API_TOKEN="$${VULYK_API_TOKEN}"
        export VULYK_CI_PROVIDER=woodpecker
        export VULYK_PROJECT_KEY="$${VULYK_PROJECT_KEY:-}"
        export VULYK_PROJECT_ID="$${VULYK_PROJECT_ID:-}"
        export VULYK_RUN_ID="$${VULYK_RUN_ID:-}"

        PIPELINE_URL="$${CI_PIPELINE_URL}"
        BRANCH="$${CI_COMMIT_BRANCH:-$${CI_COMMIT_SOURCE_BRANCH:-main}}"
        COMMIT="$${CI_COMMIT_SHA}"

        project_flag() {
          if [ -n "$${VULYK_PROJECT_ID}" ]; then
            printf '%s\n' --project-id "$${VULYK_PROJECT_ID}"
          elif [ -n "$${VULYK_PROJECT_KEY}" ]; then
            printf '%s\n' --project-key "$${VULYK_PROJECT_KEY}"
          fi
        }

        if [ -n "$${VULYK_RUN_ID}" ]; then
          "$${UPLOADER}" --start-run --run-id "$${VULYK_RUN_ID}" \
            --provider woodpecker \
            --branch "$${BRANCH}" --commit "$${COMMIT}" \
            --pipeline-url "$${PIPELINE_URL}" \
            $(project_flag)
        else
          VULYK_RUN_ID="$("$${UPLOADER}" --open-run --print-run-id \
            --suite-name "Woodpecker #$${CI_PIPELINE_NUMBER}" \
            --provider woodpecker --repo "$${CI_REPO}" \
            --branch "$${BRANCH}" --commit "$${COMMIT}" \
            --pipeline-url "$${PIPELINE_URL}" \
            $(project_flag))"
          export VULYK_RUN_ID
        fi

        if [ -f report.xml ]; then
          "$${UPLOADER}" --file report.xml --format junit --provider woodpecker
        fi
        "$${UPLOADER}" --close-run --provider woodpecker
    secrets: [VULYK_API_URL, VULYK_API_TOKEN]
    when:
      - status: [success, failure]
