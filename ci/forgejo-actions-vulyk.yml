# Example Forgejo / Gitea Actions workflow for Vulyk CI reporting.
#
# Save under `.forgejo/workflows/vulyk.yml` (Forgejo) or `.gitea/workflows/vulyk.yml`
# (Gitea). Configure a Vulyk CI trigger with provider `forgejo` or `gitea`:
#   base_url          — API-reachable origin (may be an internal Docker hostname)
#   public_base_url   — optional browser-facing origin for pipeline links
#   token / owner / repo / workflow_id / ref
#
# On the Vulyk host, set VULYK_FORGEJO_PUBLIC_BASE_URL or VULYK_GITEA_PUBLIC_BASE_URL
# so inbound reporters that see http://vulyk-forgejo:3000/... store clickable links.
#
# Point a repository webhook at:
#   POST /api/v1/webhooks/forgejo   (or /gitea)
# with the same HMAC secret as the CI config webhook_secret.

name: Vulyk report

on:
  workflow_dispatch:
    inputs:
      vulyk_run_id:
        description: Existing Vulyk run id (from CI Dispatch / Run in CI)
        required: false
        type: string
        default: ''
  push:
    branches: [main]

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open or attach Vulyk run
        id: open
        env:
          VULYK_API_URL: ${{ secrets.VULYK_API_URL }}
          VULYK_API_TOKEN: ${{ secrets.VULYK_API_TOKEN }}
          VULYK_PROJECT_KEY: ${{ secrets.VULYK_PROJECT_KEY }}
          VULYK_RUN_ID: ${{ inputs.vulyk_run_id }}
          # Prefer forgejo|gitea explicitly; auto-detect also checks GITHUB_SERVER_URL.
          VULYK_CI_PROVIDER: forgejo
        run: |
          set -euo pipefail
          PIPELINE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "${VULYK_RUN_ID}" ]; then
            ./scripts/vulyk-upload.sh --start-run \
              --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
              --pipeline-url "${PIPELINE_URL}"
          else
            VULYK_RUN_ID="$(./scripts/vulyk-upload.sh --open-run --print-run-id \
              --suite-name "Forgejo #${GITHUB_RUN_NUMBER}" \
              --provider forgejo --repo "${GITHUB_REPOSITORY}" \
              --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
              --pipeline-url "${PIPELINE_URL}")"
            echo "VULYK_RUN_ID=${VULYK_RUN_ID}" >> "$GITHUB_ENV"
          fi

      - name: Upload results
        if: always()
        env:
          VULYK_API_URL: ${{ secrets.VULYK_API_URL }}
          VULYK_API_TOKEN: ${{ secrets.VULYK_API_TOKEN }}
          VULYK_PROJECT_KEY: ${{ secrets.VULYK_PROJECT_KEY }}
        run: |
          set -euo pipefail
          # Replace with your real result file after tests.
          if [ -f report.xml ]; then
            ./scripts/vulyk-upload.sh --file report.xml --format junit
          fi
          ./scripts/vulyk-upload.sh --close-run
