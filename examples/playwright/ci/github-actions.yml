# Copy to .github/workflows/vulyk.yml in the automation repo.
# Secrets: VULYK_API_URL, VULYK_API_TOKEN, VULYK_PROJECT_KEY (optional).

name: Vulyk playwright

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vulyk_run_id:
        description: Existing Vulyk run id (from Run in CI)
        required: false
        type: string
        default: ''

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Test
        run: npx playwright test || true
      - name: Report to Vulyk
        if: always()
        env:
          VULYK_API_URL: ${{ secrets.VULYK_API_URL }}
          VULYK_API_TOKEN: ${{ secrets.VULYK_API_TOKEN }}
          VULYK_PROJECT_KEY: ${{ secrets.VULYK_PROJECT_KEY }}
          VULYK_RUN_ID: ${{ inputs.vulyk_run_id }}
        run: |
            set -eu
            if [ -f ./scripts/vulyk-upload.sh ]; then
              UPLOADER=./scripts/vulyk-upload.sh
            elif [ -f ../../scripts/vulyk-upload.sh ]; then
              UPLOADER=../../scripts/vulyk-upload.sh
            else
              curl -fsSL -o vulyk-upload.sh \
                https://raw.githubusercontent.com/Ihor-Meat-Proxy/Vulyk/main/scripts/vulyk-upload.sh
              chmod +x vulyk-upload.sh
              UPLOADER=./vulyk-upload.sh
            fi
            export VULYK_API_URL VULYK_API_TOKEN
            export VULYK_PROJECT_KEY="${VULYK_PROJECT_KEY:-KOC}"

            if [ -n "${VULYK_RUN_ID:-}" ]; then
              "$UPLOADER" --start-run \
                --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
                --pipeline-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true
            else
              VULYK_RUN_ID="$("$UPLOADER" --open-run --print-run-id \
                --suite-name "playwright #${GITHUB_RUN_NUMBER}" \
                --provider github \
                --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
                --pipeline-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
              export VULYK_RUN_ID
            fi
            if [ -e "results.xml" ]; then
              "$UPLOADER" --file "results.xml" --format junit
            fi
            "$UPLOADER" --close-run

